# Mosquitto MQTT Broker Configuration
# Listens on 1883 (plain) inside Docker — TLS terminated by Traefik on 8883

listener 1883
protocol mqtt

# Authentication
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
