# Telegraf Configuration — MQTT Consumer → InfluxDB v2

[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "telegraf"

# MQTT Consumer — subscribe to all sensor data topics
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["homelab/sensors/+/data"]
  username = "telegraf"
  password = "${MQTT_PASS_TELEGRAF}"
  data_format = "json"
  topic_tag = ""

  # Extract sensor_id from topic: homelab/sensors/{sensor_id}/data
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "homelab/sensors/+/data"
    tags = "_/_/sensor_id/_"

# InfluxDB v2 Output
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
