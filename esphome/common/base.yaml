# Base config for all homelab sensors
# XIAO ESP32-C6 + GY-SHT31-D
#
# Usage: Each sensor file sets substitutions and includes this via packages.
# Secrets are in secrets.yaml (not committed to git).

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Homelab sensor — ${location}"

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

# --- Logging ---
logger:
  level: INFO

# --- WiFi ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  # Open fallback AP for re-provisioning (matches shelf-sensor pattern)
  ap:
    ssid: "${device_name}-setup"

captive_portal:

# --- Home Assistant Native API ---
api:
  encryption:
    key: !secret api_encryption_key

# --- OTA Updates ---
ota:
  - platform: esphome
    password: !secret ota_password

# --- Web Server (for debugging — visit sensor IP in browser) ---
web_server:
  port: 80

# --- I2C Bus ---
# XIAO ESP32-C6 silkscreen: D4 = GPIO22 (SDA), D5 = GPIO23 (SCL).
# (Legacy firmware's PIN_SDA=6/PIN_SCL=7 was the C3 pinout — wrong for C6.)
i2c:
  sda: GPIO22  # D4
  scl: GPIO23  # D5
  scan: true

# --- SHT31-D Sensor ---
# Sensor names are short ("Temp" / "Humidity") so HA entity_id becomes
# sensor.<device_slug>_temp / _humidity (matches the convention already
# in use across the homelab).
sensor:
  - platform: sht3xd
    address: ${sht31_address}
    update_interval: ${update_interval}
    temperature:
      name: "Temp"
      id: temperature
      unit_of_measurement: "°F"
      accuracy_decimals: 1
      filters:
        - lambda: return x * (9.0/5.0) + 32.0;
        - offset: ${temp_offset}
    humidity:
      name: "Humidity"
      id: humidity
      unit_of_measurement: "%"
      accuracy_decimals: 1
      filters:
        - offset: ${humidity_offset}

  # WiFi signal strength
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  # Uptime
  - platform: uptime
    name: "Uptime"
    unit_of_measurement: "s"

# --- Status LED ---
status_led:
  pin:
    number: GPIO15
    inverted: false

# --- Diagnostic Sensors ---
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "WiFi SSID"

button:
  - platform: restart
    name: "Restart"

  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_btn

# Hold D0 to GND for 3 seconds to factory reset
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO2  # D0
      mode: INPUT_PULLUP
      inverted: true
    name: "Reset Button"
    filters:
      - delayed_on: 3s
    on_press:
      then:
        - logger.log: "Factory reset triggered via GPIO2!"
        - button.press: factory_reset_btn
